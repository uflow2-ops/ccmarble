<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>체크인 춘천 (Check-in Chuncheon)</title>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- 시작 화면: 플레이어 수, 모드, 닉네임 및 캐릭터 입력 -->
    <div class="start-screen" id="startScreen">
        <div class="start-card" style="max-height: 90vh; overflow-y: auto;">
            <h2>🎲 체크인 춘천</h2>
            <p>우리 동네 춘천을 여행하는 신나는 부루마블!</p>
            
            <div class="config-area">
                <label for="playerCountSelect">참가할 인원수를 선택하세요</label>
                <select id="playerCountSelect" onchange="updateNicknameFields()">
                    <option value="1">1명</option>
                    <option value="2" selected>2명</option>
                    <option value="3">3명</option>
                    <option value="4">4명</option>
                </select>

                <!-- 게임 모드 선택 영역 -->
                <label>게임 모드를 선택하세요</label>
                <div style="display: flex; gap: 10px; margin-bottom: 14px;">
                    <label style="flex: 1; padding: 12px; background: #eff6ff; border: 2px solid #2563eb; border-radius: 12px; text-align: center; cursor: pointer; font-size: 14px; font-weight: 700; box-shadow: 0 3px 0 #93c5fd;">
                        <input type="radio" name="gameMode" value="time" checked onclick="toggleModeSettings('time')"> ⏱️ 타임 어택
                    </label>
                    <label style="flex: 1; padding: 12px; background: white; border: 2px solid #e2e8f0; border-radius: 12px; text-align: center; cursor: pointer; font-size: 14px; font-weight: 700; box-shadow: 0 3px 0 #cbd5e1;">
                        <input type="radio" name="gameMode" value="turn" onclick="toggleModeSettings('turn')"> 🔄 턴 제한
                    </label>
                </div>

                <!-- 모드별 상세 설정값 조절 -->
                <div id="modeSettingContainer" style="margin-bottom: 16px; background: #f8fafc; padding: 14px; border-radius: 12px; border: 1px solid #e2e8f0;">
                    <div id="timeSettingBox">
                        <label style="font-size: 13px; margin-bottom: 6px; display: block; font-weight: 700; color: #1e293b;">제한 시간 (분)</label>
                        <input type="number" id="timeLimitInput" value="10" min="1" max="60" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;text-align:center;font-weight:700;">
                    </div>
                    <div id="turnSettingBox" style="display: none;">
                        <label style="font-size: 13px; margin-bottom: 6px; display: block; font-weight: 700; color: #1e293b;">진행할 총 턴 수</label>
                        <input type="number" id="turnLimitInput" value="20" min="5" max="100" style="width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:10px;font-size:14px;text-align:center;font-weight:700;">
                    </div>
                </div>

                <div id="nicknameFieldsContainer"></div>
            </div>
            <button class="btn-primary" onclick="initLocalGame()" style="width:100%; margin-bottom: 10px;">🎮 춘천 여행 시작하기</button>
            <button class="btn-secondary" onclick="openAdminModal()" style="width:100%;">⚙️ 보드판 이름 & 사진 관리자</button>
        </div>
    </div>

    <!-- 메인 게임 보드 화면 -->
    <div class="main-container">
        <!-- 왼쪽 사이드바 -->
        <div class="sidebar">
            <h1 class="main-title">체크인 춘천</h1>
            <div class="turn-badge" id="turnBadge">대기 중</div>
            
            <div id="gameStatusInfo" style="background: #ffffff; padding: 12px; border-radius: 12px; border: 2px solid #e2e8f0; text-align: center; font-weight: 800; font-size: 14px; color: #0f172a; box-shadow: 0 2px 8px rgba(0,0,0,0.05);">
                게임 대기 중
            </div>

            <div class="dice-section">
                <button class="btn-roll" id="rollBtn" onclick="rollDice()">🎲 주사위 던지기</button>
            </div>
            <div class="player-status" id="playerStatus"></div>
        </div>

        <!-- 오른쪽 보드판 -->
        <div class="board-wrapper">
            <div class="board-grid" id="boardGrid">
                <div class="center-lake" id="centerArea">
                    <div class="center-dice-display" id="centerDiceDisplay">
                        <div style="font-size: 16px; font-weight: 800; margin-bottom: 8px; color: #2563eb;">🎲 주사위 결과</div>
                        <div class="center-dice-box" id="centerDiceBox">🎲 🎲</div>
                    </div>

                    <div class="center-default-info" id="centerDefault">
                        <h3>🌊 체크인 춘천</h3>
                        <p>주사위를 굴려 우리 고장의 명소를 둘러보세요!</p>
                    </div>
                    <div class="center-landmark-info" id="centerLandmark" style="display:none;">
                        <img id="centerImage" src="" alt="장소 이미지">
                        <h4 id="centerTitle">장소 이름</h4>
                        <p id="centerDesc">장소 설명이 여기에 표시됩니다.</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- 각종 모달창들 -->
    <div class="modal-overlay" id="winModal">
        <div class="modal-card">
            <h2 id="winTitle">🎉 게임 종료!</h2>
            <p id="winMessage" class="win-message"></p>
            <div id="winRanking" class="win-ranking"></div>
            <button class="btn-primary" onclick="location.reload()" style="width:100%;margin-top:16px">처음으로</button>
        </div>
    </div>

    <div class="modal-overlay" id="quizModal">
        <div class="modal-card">
            <div class="modal-header">
                <span class="badge" id="modalCategory">공공기관</span>
                <span class="modal-title" id="modalTitle">장소 이름</span>
            </div>
            <div class="quiz-question" id="modalQuestion">퀴즈 질문이 들어갑니다.</div>
            <div class="quiz-options" id="modalOptions"></div>
            <div class="result-msg" id="resultMsg"></div>
            <button class="btn-next" id="btnNext" onclick="closeQuizModal()">다음 플레이어로 넘어가기</button>
        </div>
    </div>

    <!-- 관리자 모달 -->
    <div class="modal-overlay" id="adminModal" style="z-index: 10000;">
        <div class="modal-card" style="max-height: 90vh; display: flex; flex-direction: column;">
            <h2 style="margin-bottom: 10px; color: #0f172a;">⚙️ 보드판 이름 & 사진 관리자</h2>
            <p style="font-size: 13px; margin-bottom: 15px; color: #64748b; word-break: keep-all;">
                각 칸의 이름과 표시될 사진 주소(URL)를 자유롭게 변경할 수 있습니다.<br>
                <span style="color: #ef4444; font-weight: bold;">(주의: 현재 브라우저를 끄면 초기화됩니다!)</span>
            </p>
            
            <div id="adminImageList" style="overflow-y: auto; margin-bottom: 15px; flex: 1; padding-right: 5px; display: flex; flex-direction: column; gap: 8px;">
                <!-- 스크립트로 자동 생성 -->
            </div>
            
            <div style="display: flex; gap: 10px;">
                <button class="btn-primary" onclick="saveAdminSettings()" style="flex: 2;">저장하기</button>
                <button class="btn-secondary" onclick="closeAdminModal()" style="flex: 1;">닫기</button>
            </div>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
